name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instaliraj zavisnosti
        run: npm install

      - name: Instaliraj Capacitor CLI globalno
        run: npm install -g @capacitor/cli @capacitor/android

      - name: Dodaj Android platformu ako ne postoji i sinhronizuj
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Postavi Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Pokreni gradnju APK fajla u Android-u
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sačuvaj APK fajl kao artefakt
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk