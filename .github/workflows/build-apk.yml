name: Build Android APK

on:
  push:
    branches: [ "main" ] # Pokreće se automatski kad god pošalješ kod na main granu

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v3

      - name: Postavi Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instaliraj zavisnosti
        run: npm install

      - name: Instaliraj Capacitor CLI globalno (opcionalno)
        run: npm install -g @capacitor/cli

      - name: Sinhronizuj Capacitor
        run: npx cap sync android

      - name: Postavi Java Environment (potrebno za Android build)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pokreni gradnju APK fajla u Android-u
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sačuvaj APK fajl kao artefakt
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk